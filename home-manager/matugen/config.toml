[config]
# Matugen configuration — wallpaper-driven theming.

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/current-theme.conf"

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell-colors.qml"
output_path = "~/.config/quickshell/styles/themes/matugen/Theme.qml"

[templates.nvim]
input_path = "~/.config/matugen/templates/nvim.lua"
output_path = "~/.config/nvim/lua/config/matugen.lua"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.vicinae]
input_path = "~/.config/matugen/templates/vicinae.toml"
output_path = "~/.config/vicinae/themes/matugen.toml"

[templates.zen]
input_path = "~/.config/matugen/templates/zen-userChrome.css"
output_path = "~/.config/zen/default/chrome/userChrome.css"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.lazygit]
input_path = "~/.config/matugen/templates/lazygit.yml"
output_path = "~/.config/lazygit/config.yml"

[templates.cava]
input_path = "~/.config/matugen/templates/cava.conf"
output_path = "~/.config/cava/config"

[templates.fzf]
input_path = "~/.config/matugen/templates/fzf.zsh"
output_path = "~/.config/fzf/fzf-matugen.zsh"

[templates.zathura]
input_path = "~/.config/matugen/templates/zathurarc"
output_path = "~/.config/zathura/zathurarc"

[templates.swaylock]
input_path = "~/.config/matugen/templates/swaylock.config"
output_path = "~/.config/swaylock/config"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock.conf"
