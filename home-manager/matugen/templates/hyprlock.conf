# Hyprlock configuration styled with Matugen

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME (Hours : Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb({{ colors.primary.default.hex_stripped }})
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgb({{ colors.on_surface.default.hex_stripped }})
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    rounding = 25
    fade_on_empty = false
    placeholder_text = <span foreground="##{{ colors.on_surface_variant.default.hex_stripped }}88">Password...</span>
    hide_input = false

    outer_color = rgba({{ colors.outline_variant.default.hex_stripped }}88)
    inner_color = rgba({{ colors.surface_container_highest.default.hex_stripped }}bb)
    font_color = rgb({{ colors.on_surface.default.hex_stripped }})

    check_color = rgb({{ colors.primary.default.hex_stripped }})
    fail_color = rgb({{ colors.error.default.hex_stripped }})
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300

    capslock_color = rgb({{ colors.tertiary.default.hex_stripped }})
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
}
