# Matugen template for Yazi (theme.toml)
# Flavor / Colors generated from Material You palette

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }

# Hovered
hovered         = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "{{colors.tertiary.default.hex}}", italic = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bg = "reset", bold = true }

# Marker
marker_copied   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_selected = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }

# Tab
tab_active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
tab_inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
tab_width    = 1

# Count
count_copied   = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
count_cut      = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }

# Border
border_symbol = "│"
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "{{colors.surface_container_high.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

# Mode
mode_normal = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
mode_select = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
mode_unset  = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }

# Progress
progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

# Permissions
permissions_t = { fg = "{{colors.primary.default.hex}}" }
permissions_r = { fg = "{{colors.tertiary.default.hex}}" }
permissions_w = { fg = "{{colors.error.default.hex}}" }
permissions_x = { fg = "{{colors.secondary.default.hex}}" }
permissions_s = { fg = "{{colors.outline.default.hex}}" }

[select]
border   = { fg = "{{colors.outline_variant.default.hex}}" }
active   = { fg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[input]
border   = { fg = "{{colors.outline_variant.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
value    = { fg = "{{colors.on_surface.default.hex}}" }
selected = { bg = "{{colors.surface_container_high.default.hex}}" }

[completion]
border   = { fg = "{{colors.outline_variant.default.hex}}" }
active   = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[tasks]
border  = { fg = "{{colors.outline_variant.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[which]
mask            = { bg = "{{colors.surface_container.default.hex}}" }
cand            = { fg = "{{colors.primary.default.hex}}" }
rest            = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc            = { fg = "{{colors.on_surface.default.hex}}" }
separator       = "  "
separator_style = { fg = "{{colors.outline.default.hex}}" }

[help]
on      = { fg = "{{colors.primary.default.hex}}" }
run     = { fg = "{{colors.secondary.default.hex}}" }
desc    = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { bg = "{{colors.surface_container_high.default.hex}}" }
footer  = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.primary.default.hex}}" }
title_warn  = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "{{colors.secondary.default.hex}}" },

  # Videos
  { mime = "video/*", fg = "{{colors.tertiary.default.hex}}" },
  { mime = "audio/*", fg = "{{colors.tertiary.default.hex}}" },

  # Archives
  { mime = "application/*zip", fg = "{{colors.error.default.hex}}" },
  { mime = "application/x-tar", fg = "{{colors.error.default.hex}}" },
  { mime = "application/x-bzip*", fg = "{{colors.error.default.hex}}" },
  { mime = "application/x-7z-compressed", fg = "{{colors.error.default.hex}}" },
  { mime = "application/x-rar", fg = "{{colors.error.default.hex}}" },

  # Documents
  { mime = "application/pdf", fg = "{{colors.primary.default.hex}}" },

  # Directories
  { url = "*/", fg = "{{colors.primary.default.hex}}" },
]
