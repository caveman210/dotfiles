# Matugen template for Yazi (theme.toml)
# Flavor / Colors generated from Material You palette

[mgr]
cwd = { fg = "#c7bfff" }

# Hovered
hovered         = { fg = "#e5e1e9", bg = "#2a292f" }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#ecb8ce", italic = true }
find_position = { fg = "#c8c3dc", bg = "reset", bold = true }

# Marker
marker_copied   = { fg = "#c8c3dc", bg = "#c8c3dc" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#c7bfff", bg = "#c7bfff" }
marker_selected = { fg = "#ecb8ce", bg = "#ecb8ce" }

# Tab
tab_active   = { fg = "#2f295f", bg = "#c7bfff" }
tab_inactive = { fg = "#c9c5d0", bg = "#201f25" }
tab_width    = 1

# Count
count_copied   = { fg = "#302e41", bg = "#c8c3dc" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#482537", bg = "#ecb8ce" }

# Border
border_symbol = "│"
border_style  = { fg = "#47464f" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#2a292f", bg = "#2a292f" }

# Mode
mode_normal = { fg = "#2f295f", bg = "#c7bfff", bold = true }
mode_select = { fg = "#302e41", bg = "#c8c3dc", bold = true }
mode_unset  = { fg = "#482537", bg = "#ecb8ce", bold = true }

# Progress
progress_label  = { fg = "#e5e1e9", bold = true }
progress_normal = { fg = "#c7bfff", bg = "#2a292f" }
progress_error  = { fg = "#ffb4ab", bg = "#2a292f" }

# Permissions
permissions_t = { fg = "#c7bfff" }
permissions_r = { fg = "#ecb8ce" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#c8c3dc" }
permissions_s = { fg = "#928f99" }

[select]
border   = { fg = "#47464f" }
active   = { fg = "#c7bfff", bold = true }
inactive = { fg = "#e5e1e9" }

[input]
border   = { fg = "#47464f" }
title    = { fg = "#c7bfff" }
value    = { fg = "#e5e1e9" }
selected = { bg = "#2a292f" }

[completion]
border   = { fg = "#47464f" }
active   = { fg = "#c7bfff", bg = "#2a292f" }
inactive = { fg = "#e5e1e9" }

[tasks]
border  = { fg = "#47464f" }
title   = { fg = "#c7bfff" }
hovered = { fg = "#e5e1e9", bg = "#2a292f" }

[which]
mask            = { bg = "#201f25" }
cand            = { fg = "#c7bfff" }
rest            = { fg = "#c9c5d0" }
desc            = { fg = "#e5e1e9" }
separator       = "  "
separator_style = { fg = "#928f99" }

[help]
on      = { fg = "#c7bfff" }
run     = { fg = "#c8c3dc" }
desc    = { fg = "#e5e1e9" }
hovered = { bg = "#2a292f" }
footer  = { fg = "#c9c5d0", bg = "#201f25" }

[notify]
title_info  = { fg = "#c7bfff" }
title_warn  = { fg = "#ecb8ce" }
title_error = { fg = "#ffb4ab" }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#c8c3dc" },

  # Videos
  { mime = "video/*", fg = "#ecb8ce" },
  { mime = "audio/*", fg = "#ecb8ce" },

  # Archives
  { mime = "application/*zip", fg = "#ffb4ab" },
  { mime = "application/x-tar", fg = "#ffb4ab" },
  { mime = "application/x-bzip*", fg = "#ffb4ab" },
  { mime = "application/x-7z-compressed", fg = "#ffb4ab" },
  { mime = "application/x-rar", fg = "#ffb4ab" },

  # Documents
  { mime = "application/pdf", fg = "#c7bfff" },

  # Directories
  { url = "*/", fg = "#c7bfff" },
]
