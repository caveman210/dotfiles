# Matugen template for Yazi (theme.toml)
# Flavor / Colors generated from Material You palette

[mgr]
cwd = { fg = "#ffb4ab" }

# Hovered
hovered         = { fg = "#f9dcd8", bg = "#372624" }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#a5c8ff", italic = true }
find_position = { fg = "#ffb4ab", bg = "reset", bold = true }

# Marker
marker_copied   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#a5c8ff", bg = "#a5c8ff" }

# Tab
tab_active   = { fg = "#690004", bg = "#ffb4ab" }
tab_inactive = { fg = "#e3beb9", bg = "#2b1c1a" }
tab_width    = 1

# Count
count_copied   = { fg = "#60130f", bg = "#ffb4ab" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#00315e", bg = "#a5c8ff" }

# Border
border_symbol = "│"
border_style  = { fg = "#5b403d" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#372624", bg = "#372624" }

# Mode
mode_normal = { fg = "#690004", bg = "#ffb4ab", bold = true }
mode_select = { fg = "#60130f", bg = "#ffb4ab", bold = true }
mode_unset  = { fg = "#00315e", bg = "#a5c8ff", bold = true }

# Progress
progress_label  = { fg = "#f9dcd8", bold = true }
progress_normal = { fg = "#ffb4ab", bg = "#372624" }
progress_error  = { fg = "#ffb4ab", bg = "#372624" }

# Permissions
permissions_t = { fg = "#ffb4ab" }
permissions_r = { fg = "#a5c8ff" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#ffb4ab" }
permissions_s = { fg = "#aa8985" }

[select]
border   = { fg = "#5b403d" }
active   = { fg = "#ffb4ab", bold = true }
inactive = { fg = "#f9dcd8" }

[input]
border   = { fg = "#5b403d" }
title    = { fg = "#ffb4ab" }
value    = { fg = "#f9dcd8" }
selected = { bg = "#372624" }

[completion]
border   = { fg = "#5b403d" }
active   = { fg = "#ffb4ab", bg = "#372624" }
inactive = { fg = "#f9dcd8" }

[tasks]
border  = { fg = "#5b403d" }
title   = { fg = "#ffb4ab" }
hovered = { fg = "#f9dcd8", bg = "#372624" }

[which]
mask            = { bg = "#2b1c1a" }
cand            = { fg = "#ffb4ab" }
rest            = { fg = "#e3beb9" }
desc            = { fg = "#f9dcd8" }
separator       = "  "
separator_style = { fg = "#aa8985" }

[help]
on      = { fg = "#ffb4ab" }
run     = { fg = "#ffb4ab" }
desc    = { fg = "#f9dcd8" }
hovered = { bg = "#372624" }
footer  = { fg = "#e3beb9", bg = "#2b1c1a" }

[notify]
title_info  = { fg = "#ffb4ab" }
title_warn  = { fg = "#a5c8ff" }
title_error = { fg = "#ffb4ab" }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#ffb4ab" },

  # Videos
  { mime = "video/*", fg = "#a5c8ff" },
  { mime = "audio/*", fg = "#a5c8ff" },

  # Archives
  { mime = "application/*zip", fg = "#ffb4ab" },
  { mime = "application/x-tar", fg = "#ffb4ab" },
  { mime = "application/x-bzip*", fg = "#ffb4ab" },
  { mime = "application/x-7z-compressed", fg = "#ffb4ab" },
  { mime = "application/x-rar", fg = "#ffb4ab" },

  # Documents
  { mime = "application/pdf", fg = "#ffb4ab" },

  # Directories
  { url = "*/", fg = "#ffb4ab" },
]
