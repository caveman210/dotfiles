# Matugen template for Yazi (theme.toml)
# Flavor / Colors generated from Material You palette

[mgr]
cwd = { fg = "#b5c9d6" }

# Hovered
hovered         = { fg = "#e4e2e2", bg = "#292a2b" }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#e4bfa7", italic = true }
find_position = { fg = "#c0c7cd", bg = "reset", bold = true }

# Marker
marker_copied   = { fg = "#c0c7cd", bg = "#c0c7cd" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#b5c9d6", bg = "#b5c9d6" }
marker_selected = { fg = "#e4bfa7", bg = "#e4bfa7" }

# Tab
tab_active   = { fg = "#20333c", bg = "#b5c9d6" }
tab_inactive = { fg = "#c3c7cb", bg = "#1f2020" }
tab_width    = 1

# Count
count_copied   = { fg = "#2a3136", bg = "#c0c7cd" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#422b1b", bg = "#e4bfa7" }

# Border
border_symbol = "│"
border_style  = { fg = "#43474b" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#292a2b", bg = "#292a2b" }

# Mode
mode_normal = { fg = "#20333c", bg = "#b5c9d6", bold = true }
mode_select = { fg = "#2a3136", bg = "#c0c7cd", bold = true }
mode_unset  = { fg = "#422b1b", bg = "#e4bfa7", bold = true }

# Progress
progress_label  = { fg = "#e4e2e2", bold = true }
progress_normal = { fg = "#b5c9d6", bg = "#292a2b" }
progress_error  = { fg = "#ffb4ab", bg = "#292a2b" }

# Permissions
permissions_t = { fg = "#b5c9d6" }
permissions_r = { fg = "#e4bfa7" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#c0c7cd" }
permissions_s = { fg = "#8d9195" }

[select]
border   = { fg = "#43474b" }
active   = { fg = "#b5c9d6", bold = true }
inactive = { fg = "#e4e2e2" }

[input]
border   = { fg = "#43474b" }
title    = { fg = "#b5c9d6" }
value    = { fg = "#e4e2e2" }
selected = { bg = "#292a2b" }

[completion]
border   = { fg = "#43474b" }
active   = { fg = "#b5c9d6", bg = "#292a2b" }
inactive = { fg = "#e4e2e2" }

[tasks]
border  = { fg = "#43474b" }
title   = { fg = "#b5c9d6" }
hovered = { fg = "#e4e2e2", bg = "#292a2b" }

[which]
mask            = { bg = "#1f2020" }
cand            = { fg = "#b5c9d6" }
rest            = { fg = "#c3c7cb" }
desc            = { fg = "#e4e2e2" }
separator       = "  "
separator_style = { fg = "#8d9195" }

[help]
on      = { fg = "#b5c9d6" }
run     = { fg = "#c0c7cd" }
desc    = { fg = "#e4e2e2" }
hovered = { bg = "#292a2b" }
footer  = { fg = "#c3c7cb", bg = "#1f2020" }

[notify]
title_info  = { fg = "#b5c9d6" }
title_warn  = { fg = "#e4bfa7" }
title_error = { fg = "#ffb4ab" }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#c0c7cd" },

  # Videos
  { mime = "video/*", fg = "#e4bfa7" },
  { mime = "audio/*", fg = "#e4bfa7" },

  # Archives
  { mime = "application/*zip", fg = "#ffb4ab" },
  { mime = "application/x-tar", fg = "#ffb4ab" },
  { mime = "application/x-bzip*", fg = "#ffb4ab" },
  { mime = "application/x-7z-compressed", fg = "#ffb4ab" },
  { mime = "application/x-rar", fg = "#ffb4ab" },

  # Documents
  { mime = "application/pdf", fg = "#b5c9d6" },

  # Directories
  { url = "*/", fg = "#b5c9d6" },
]
