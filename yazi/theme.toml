# Matugen template for Yazi (theme.toml)
# Flavor / Colors generated from Material You palette

[mgr]
cwd = { fg = "#85d2e7" }

# Hovered
hovered         = { fg = "#dee3e6", bg = "#252b2d" }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#bfc4eb", italic = true }
find_position = { fg = "#b2cbd3", bg = "reset", bold = true }

# Marker
marker_copied   = { fg = "#b2cbd3", bg = "#b2cbd3" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#85d2e7", bg = "#85d2e7" }
marker_selected = { fg = "#bfc4eb", bg = "#bfc4eb" }

# Tab
tab_active   = { fg = "#003641", bg = "#85d2e7" }
tab_inactive = { fg = "#bfc8cb", bg = "#1b2022" }
tab_width    = 1

# Count
count_copied   = { fg = "#1d343a", bg = "#b2cbd3" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#292e4d", bg = "#bfc4eb" }

# Border
border_symbol = "│"
border_style  = { fg = "#3f484b" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#252b2d", bg = "#252b2d" }

# Mode
mode_normal = { fg = "#003641", bg = "#85d2e7", bold = true }
mode_select = { fg = "#1d343a", bg = "#b2cbd3", bold = true }
mode_unset  = { fg = "#292e4d", bg = "#bfc4eb", bold = true }

# Progress
progress_label  = { fg = "#dee3e6", bold = true }
progress_normal = { fg = "#85d2e7", bg = "#252b2d" }
progress_error  = { fg = "#ffb4ab", bg = "#252b2d" }

# Permissions
permissions_t = { fg = "#85d2e7" }
permissions_r = { fg = "#bfc4eb" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#b2cbd3" }
permissions_s = { fg = "#899295" }

[select]
border   = { fg = "#3f484b" }
active   = { fg = "#85d2e7", bold = true }
inactive = { fg = "#dee3e6" }

[input]
border   = { fg = "#3f484b" }
title    = { fg = "#85d2e7" }
value    = { fg = "#dee3e6" }
selected = { bg = "#252b2d" }

[completion]
border   = { fg = "#3f484b" }
active   = { fg = "#85d2e7", bg = "#252b2d" }
inactive = { fg = "#dee3e6" }

[tasks]
border  = { fg = "#3f484b" }
title   = { fg = "#85d2e7" }
hovered = { fg = "#dee3e6", bg = "#252b2d" }

[which]
mask            = { bg = "#1b2022" }
cand            = { fg = "#85d2e7" }
rest            = { fg = "#bfc8cb" }
desc            = { fg = "#dee3e6" }
separator       = "  "
separator_style = { fg = "#899295" }

[help]
on      = { fg = "#85d2e7" }
run     = { fg = "#b2cbd3" }
desc    = { fg = "#dee3e6" }
hovered = { bg = "#252b2d" }
footer  = { fg = "#bfc8cb", bg = "#1b2022" }

[notify]
title_info  = { fg = "#85d2e7" }
title_warn  = { fg = "#bfc4eb" }
title_error = { fg = "#ffb4ab" }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#b2cbd3" },

  # Videos
  { mime = "video/*", fg = "#bfc4eb" },
  { mime = "audio/*", fg = "#bfc4eb" },

  # Archives
  { mime = "application/*zip", fg = "#ffb4ab" },
  { mime = "application/x-tar", fg = "#ffb4ab" },
  { mime = "application/x-bzip*", fg = "#ffb4ab" },
  { mime = "application/x-7z-compressed", fg = "#ffb4ab" },
  { mime = "application/x-rar", fg = "#ffb4ab" },

  # Documents
  { mime = "application/pdf", fg = "#85d2e7" },

  # Directories
  { url = "*/", fg = "#85d2e7" },
]
